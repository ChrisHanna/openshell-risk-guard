# Keeps the workflow actions and crates.io dependencies current. The OpenShell crates are pinned to one commit on purpose (see
# Cargo.toml) and move together by hand, so they are not listed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    # These major versions need code changes and move with the pinned OpenShell commit; they are done by hand.
    ignore:
      - dependency-name: rcgen
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: rusqlite
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: sha2
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: hmac
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
