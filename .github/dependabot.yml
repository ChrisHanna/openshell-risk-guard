# Keeps the workflow actions and crates.io dependencies current. The OpenShell crates are pinned to one commit on purpose (see
# Cargo.toml) and move together by hand, so they are not listed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
