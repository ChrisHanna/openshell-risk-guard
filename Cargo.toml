[workspace]

[package]
name = "openshell-risk-guard"
description = "Behavioral risk-based conditional access and monotonic policy guard for OpenShell"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
http = "1.2"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
# OpenShell crates come from NVIDIA's public repository, pinned to the commit the AKS gateway image is built from, so this
# repository builds on its own (no sibling checkout needed). To move to another OpenShell commit, change `rev` on all seven
# lines together and run `cargo update -p openshell-core`; the CLI and gateway versions used by scripts/aks must match it.
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", rev = "55bf786453395f3fe1858a187152537b457de77d", default-features = false, features = ["jwt"] }
openshell-extension-core = { git = "https://github.com/NVIDIA/OpenShell", rev = "55bf786453395f3fe1858a187152537b457de77d" }
openshell-gateway-interceptors = { git = "https://github.com/NVIDIA/OpenShell", rev = "55bf786453395f3fe1858a187152537b457de77d" }
openshell-policy = { git = "https://github.com/NVIDIA/OpenShell", rev = "55bf786453395f3fe1858a187152537b457de77d" }
openshell-policy-schema = { git = "https://github.com/NVIDIA/OpenShell", rev = "55bf786453395f3fe1858a187152537b457de77d" }
openshell-prover = { git = "https://github.com/NVIDIA/OpenShell", rev = "55bf786453395f3fe1858a187152537b457de77d", features = ["prebuilt-z3"] }
openshell-supervisor-middleware = { git = "https://github.com/NVIDIA/OpenShell", rev = "55bf786453395f3fe1858a187152537b457de77d" }
prost = "0.14"
prost-types = "0.14"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = { package = "noyalib", version = "0.0.53", default-features = false, features = ["std", "compat-serde-yaml"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport", "tls-aws-lc"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.10", features = ["v4"] }
x509-parser = "0.18"

[dev-dependencies]
# Test-only: generate throwaway RSA keys at run time so no private key is ever committed.
aws-lc-rs = "1.18"

[[bin]]
name = "openshell-risk-guard"
path = "src/main.rs"
