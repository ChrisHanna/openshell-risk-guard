[workspace]

[package]
name = "openshell-risk-guard"
description = "Behavioral risk-based conditional access and monotonic policy guard for OpenShell"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
http = "1.2"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
openshell-core = { path = "../OpenShell/crates/openshell-core", default-features = false, features = ["jwt"] }
openshell-extension-core = { path = "../OpenShell/crates/openshell-extension-core" }
openshell-gateway-interceptors = { path = "../OpenShell/crates/openshell-gateway-interceptors" }
openshell-policy = { path = "../OpenShell/crates/openshell-policy" }
openshell-policy-schema = { path = "../OpenShell/crates/openshell-policy-schema" }
openshell-prover = { path = "../OpenShell/crates/openshell-prover", features = ["prebuilt-z3"] }
openshell-supervisor-middleware = { path = "../OpenShell/crates/openshell-supervisor-middleware" }
prost = "0.14"
prost-types = "0.14"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots-no-provider"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = { package = "noyalib", version = "0.0.53", default-features = false, features = ["std", "compat-serde-yaml"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport", "tls-aws-lc"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.10", features = ["v4"] }

[[bin]]
name = "openshell-risk-guard"
path = "src/main.rs"
