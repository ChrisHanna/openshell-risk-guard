# cargo-deny configuration: advisories, licenses and sources for every dependency. Run with `cargo deny check`.

[graph]
all-features = false

[advisories]
# Known vulnerabilities fail the check. Unmaintained and yanked crates are reported as warnings so they are visible without
# blocking work on something the project does not control.
version = 2
yanked = "warn"
unmaintained = "workspace"
# The three `zip` advisories concern ZipArchive::extract. `zip` is only a build-time dependency of z3-sys (through OpenShell's
# openshell-prover), which unpacks the Z3 source archive it fetched itself. Risk Guard never extracts an archive at run time,
# and the version is chosen by the pinned OpenShell commit; revisit when that pin moves.
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
version = 2
# Licenses a dependency may carry. The project itself is Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Dependencies come from crates.io, plus NVIDIA's public OpenShell repository at the commit pinned in Cargo.toml.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/NVIDIA/OpenShell"]
