version: "v1"
routes:
  # GitHub-like repository read endpoints
  - method: GET
    route_template: /repos/{owner}/{repo}
    semantic_category: read_only
    high_impact: false
    resource_template: "{owner}/{repo}"

  - method: GET
    route_template: /repos/{owner}/{repo}/issues
    semantic_category: read_only
    high_impact: false
    resource_template: "{owner}/{repo}"

  - method: GET
    route_template: /repos/{owner}/{repo}/issues/**
    semantic_category: read_only
    high_impact: false
    resource_template: "{owner}/{repo}"

  - method: GET
    route_template: /repos/{owner}/{repo}/contents/**
    semantic_category: read_only
    high_impact: false
    resource_template: "{owner}/{repo}"

  - method: GET
    route_template: /repos/{owner}/{repo}/releases
    semantic_category: read_only
    high_impact: false
    resource_template: "{owner}/{repo}"

  - method: GET
    route_template: /repos/{owner}/{repo}/releases/**
    semantic_category: read_only
    high_impact: false
    resource_template: "{owner}/{repo}"

  - method: GET
    route_template: /repos/{owner}/{repo}/pulls
    semantic_category: read_only
    high_impact: false
    resource_template: "{owner}/{repo}"

  - method: GET
    route_template: /repos/{owner}/{repo}/pulls/**
    semantic_category: read_only
    high_impact: false
    resource_template: "{owner}/{repo}"

  # GraphQL multiplexes queries and mutations over one POST route and Risk Guard
  # never reads bodies, so a destructive mutation is indistinguishable from a read.
  # Treat it as high-impact; operators who rely on it approve the "/graphql"
  # resource explicitly for that agent.
  - method: POST
    route_template: /graphql
    semantic_category: opaque_rpc
    high_impact: true
    resource_template: "/graphql"

  # Read-only query POST endpoints (POST is not blindly high-impact)

  - method: POST
    route_template: /search/code
    semantic_category: read_only_query
    high_impact: false
    resource_template: "/search/code"

  - method: POST
    route_template: /search
    semantic_category: read_only_query
    high_impact: false
    resource_template: "/search"

  # Low-impact write mutations
  - method: POST
    route_template: /repos/{owner}/{repo}/issues
    semantic_category: write_mutation
    high_impact: false
    resource_template: "{owner}/{repo}"

  - method: POST
    route_template: /repos/{owner}/{repo}/pulls
    semantic_category: write_mutation
    high_impact: false
    resource_template: "{owner}/{repo}"

  # High-impact write mutations
  - method: PUT
    route_template: /repos/{owner}/{repo}/contents/**
    semantic_category: write_mutation
    high_impact: true
    resource_template: "{owner}/{repo}"

  - method: POST
    route_template: /repos/{owner}/{repo}/releases
    semantic_category: write_mutation
    high_impact: true
    resource_template: "{owner}/{repo}"

  # Destructive / administrative operations
  - method: POST
    route_template: /repos/{owner}/{repo}/hooks
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "{owner}/{repo}"

  - method: POST
    route_template: /repos/{owner}/{repo}/hooks/**
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "{owner}/{repo}"

  - method: PATCH
    route_template: /repos/{owner}/{repo}
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "{owner}/{repo}"

  - method: DELETE
    route_template: /repos/{owner}/{repo}
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "{owner}/{repo}"

  - method: DELETE
    route_template: /repos/{owner}/{repo}/issues/**
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "{owner}/{repo}"

  - method: DELETE
    route_template: /repos/{owner}/{repo}/hooks/**
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "{owner}/{repo}"

  - method: DELETE
    route_template: /repos/{owner}/{repo}/contents/**
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "{owner}/{repo}"

  - method: DELETE
    route_template: /repos/{owner}/{repo}/releases/**
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "{owner}/{repo}"

  # Local test fixture endpoints
  - method: GET
    route_template: /clean
    semantic_category: read_only
    high_impact: false
    resource_template: "/clean"

  - method: GET
    route_template: /sensitive
    semantic_category: read_only
    high_impact: false
    resource_template: "/sensitive"

  # ---- Demo services used by the AKS agent fleet (scripts/aks/agent-fleet.sh) ---------------------------------
  # Rules are scoped to their own host, so they never apply to other APIs. Resource names group what the agent
  # touches (for example every ticket route is the "tickets" resource) so a normal run is not read as fan-out.

  # Support API: tickets, customer records, knowledge base, bulk export.
  - host: support-api.openshell.svc.cluster.local
    method: GET
    route_template: /tickets
    semantic_category: read_only
    high_impact: false
    resource_template: "tickets"
  - host: support-api.openshell.svc.cluster.local
    method: GET
    route_template: /tickets/{id}
    semantic_category: read_only
    high_impact: false
    resource_template: "tickets"
  - host: support-api.openshell.svc.cluster.local
    method: GET
    route_template: /customers/{id}
    semantic_category: read_sensitive
    high_impact: false
    resource_template: "customers"
  - host: support-api.openshell.svc.cluster.local
    method: GET
    route_template: /kb
    semantic_category: read_only
    high_impact: false
    resource_template: "kb"
  - host: support-api.openshell.svc.cluster.local
    method: GET
    route_template: /exports/customers
    semantic_category: bulk_export
    high_impact: true
    resource_template: "customer-export"
  - host: support-api.openshell.svc.cluster.local
    method: DELETE
    route_template: /customers/{id}
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "customers"

  # Deploy API: services, deployments, restart, rollback, delete.
  - host: deploy-api.openshell.svc.cluster.local
    method: GET
    route_template: /services
    semantic_category: read_only
    high_impact: false
    resource_template: "services"
  - host: deploy-api.openshell.svc.cluster.local
    method: GET
    route_template: /services/{svc}
    semantic_category: read_only
    high_impact: false
    resource_template: "{svc}"
  - host: deploy-api.openshell.svc.cluster.local
    method: GET
    route_template: /services/{svc}/deployments
    semantic_category: read_only
    high_impact: false
    resource_template: "{svc}"
  - host: deploy-api.openshell.svc.cluster.local
    method: POST
    route_template: /services/{svc}/restart
    semantic_category: write_mutation
    high_impact: false
    resource_template: "{svc}"
  - host: deploy-api.openshell.svc.cluster.local
    method: POST
    route_template: /services/{svc}/rollback
    semantic_category: write_mutation
    high_impact: true
    resource_template: "{svc}"
  - host: deploy-api.openshell.svc.cluster.local
    method: DELETE
    route_template: /services/{svc}
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "{svc}"

  # Cloud API: storage buckets, costs, secrets.
  - host: cloud-api.openshell.svc.cluster.local
    method: GET
    route_template: /buckets
    semantic_category: read_only
    high_impact: false
    resource_template: "buckets"
  - host: cloud-api.openshell.svc.cluster.local
    method: GET
    route_template: /buckets/{name}
    semantic_category: read_only
    high_impact: false
    resource_template: "buckets"
  - host: cloud-api.openshell.svc.cluster.local
    method: GET
    route_template: /costs
    semantic_category: read_only
    high_impact: false
    resource_template: "costs"
  - host: cloud-api.openshell.svc.cluster.local
    method: GET
    route_template: /secrets
    semantic_category: read_sensitive
    high_impact: true
    resource_template: "secrets"
  - host: cloud-api.openshell.svc.cluster.local
    method: GET
    route_template: /secrets/{name}
    semantic_category: read_sensitive
    high_impact: true
    resource_template: "secrets"
  - host: cloud-api.openshell.svc.cluster.local
    method: DELETE
    route_template: /buckets/{name}
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "{name}"

  # Token-grant demo services (alpha and beta, deploy/aks/token-grant-demo.yaml), reached with a SPIFFE-backed token.
  - host: alpha.openshell.svc.cluster.local
    method: GET
    route_template: /records
    semantic_category: read_only
    high_impact: false
    resource_template: "records"
  - host: alpha.openshell.svc.cluster.local
    method: GET
    route_template: /records/{id}
    semantic_category: read_only
    high_impact: false
    resource_template: "records"
  - host: alpha.openshell.svc.cluster.local
    method: DELETE
    route_template: /records/{id}
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "records"
  - host: beta.openshell.svc.cluster.local
    method: GET
    route_template: /records
    semantic_category: read_only
    high_impact: false
    resource_template: "records"
  - host: beta.openshell.svc.cluster.local
    method: GET
    route_template: /records/{id}
    semantic_category: read_only
    high_impact: false
    resource_template: "records"
  - host: beta.openshell.svc.cluster.local
    method: DELETE
    route_template: /records/{id}
    semantic_category: destructive_admin
    high_impact: true
    resource_template: "records"
