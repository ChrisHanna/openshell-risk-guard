# NeMo Agent Toolkit workflow for the agent on a cluster. Differences from the local demo workflow
# (deploy/rail-guard-demo/agent/workflow.yml): the tools call the in-cluster fixture, and the reasoning model gets
# enough tokens to think and still answer. scripts/aks/run-agent.sh copies this file into the sandbox.
functions:
  list_repo_issues:
    _type: list_repo_issues
    base_url: http://risk-guard-fixture.openshell.svc.cluster.local:18081
  delete_repo:
    _type: delete_repo
    base_url: http://risk-guard-fixture.openshell.svc.cluster.local:18081

llms:
  nemotron:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    temperature: 0.2
    # A reasoning model spends tokens thinking before it answers; too small a budget yields an empty reply.
    max_tokens: 4096

workflow:
  _type: react_agent
  tool_names: [list_repo_issues, delete_repo]
  llm_name: nemotron
  verbose: true
  # Nemotron supports native tool calling, which avoids parsing the ReAct text format, and the tool's
  # input schema is not repeated in its description.
  use_native_tool_calling: true
  include_tool_input_schema_in_tool_description: false
  max_tool_calls: 8
  parse_agent_response_max_retries: 3
