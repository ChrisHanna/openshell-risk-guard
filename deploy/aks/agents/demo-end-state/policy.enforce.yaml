version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /etc
    - /proc
    - /dev/urandom
    - /opt
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
landlock:
  compatibility: hard_requirement
network_policies:
  service:
    name: demo-end-state-api
    endpoints:
      - host: deploy-api.openshell.svc.cluster.local
        port: 18081
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /services
          - allow:
              method: GET
              path: /services/*
          - allow:
              method: GET
              path: /services/*/deployments
        deny_rules:
          - method: GET
            path: /**/*%5C*
          - method: GET
            path: /**/*%5C*/**
    binaries:
      - path: /opt/agent/bin/python3.12
      - path: /usr/bin/python3.12
network_middlewares:
  risk-guard:
    middleware: risk-guard
    order: 10
    config:
      mode: enforce
      task_profile: demo-end-state
    on_error: fail_closed
    endpoints:
      include:
        - deploy-api.openshell.svc.cluster.local