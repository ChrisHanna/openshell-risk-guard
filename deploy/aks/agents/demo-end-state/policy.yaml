# Sandbox policy for the end-state demo (scripts/demo/end_state.py). It is the hand-written starting point that `policy-export` narrows: the static policy permits the
# release calls broadly, and the generated policy.enforce.yaml / policy.enforce.demo.yaml keep only what the `demo-end-state` baseline approves (plus, for the demo file,
# the reviewed exceptions in demo-exceptions.json). The sandbox is only ever created by the demo script; no fleet agent uses this profile.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /etc, /proc, /dev/urandom, /opt]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_middlewares:
  risk-guard:
    middleware: risk-guard
    order: 10
    on_error: fail_closed
    config:
      task_profile: demo-end-state
      mode: enforce
    endpoints:
      include:
        - deploy-api.openshell.svc.cluster.local
network_policies:
  service:
    name: demo-end-state-api
    endpoints:
      - host: deploy-api.openshell.svc.cluster.local
        port: 18081
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /services
          - allow:
              method: GET
              path: /services/**
          - allow:
              method: POST
              path: /services/**
          - allow:
              method: DELETE
              path: /services/**
    binaries:
      - path: /opt/agent/bin/python3.12
      - path: /usr/bin/python3.12
