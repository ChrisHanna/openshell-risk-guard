# NeMo Agent Toolkit workflow for the red-team agent: an authorized exercise against the three fixture services (no real data). Its tools are `raw_call`, which makes one HTTP request exactly
# as written, and `garak_scan`, which runs a short Garak scan of its own model. It is governed like every other agent: Risk Guard decides about each call. scripts/aks/run-redteam.sh
# copies this file into the sandbox.
functions:
  raw_call:
    _type: raw_call
  garak_scan:
    _type: garak_scan

llms:
  nemotron:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    temperature: 0.2
    # The hosted model answers 429 (too many requests) when calls come close together, as a ReAct loop's do; wait and try again instead of ending the run.
    do_auto_retry: true
    num_retries: 10
    retry_on_status_codes: [429, 500, 502, 503, 504]
    # A reasoning model thinks before it answers; a small budget is used up by the thinking and the reply comes back empty, which the agent reports as a parse failure.
    max_tokens: 6000

workflow:
  _type: react_agent
  tool_names: [raw_call, garak_scan]
  llm_name: nemotron
  verbose: true
  use_native_tool_calling: true
  include_tool_input_schema_in_tool_description: false
  max_tool_calls: 30
  parse_agent_response_max_retries: 3
