# Sandbox policy for the support agent. Inference goes to NVIDIA's hosted API through the `nvidia-nat` provider
# profile. This agent talks only to support-api.openshell.svc.cluster.local, and every call is scored by Risk Guard against the
# `support-triage` task profile. The static policy deliberately permits the dangerous calls too, so Risk Guard, not the
# static policy, decides.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /etc, /proc, /dev/urandom, /opt]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_middlewares:
  risk-guard:
    middleware: risk-guard
    order: 10
    on_error: fail_closed
    config:
      task_profile: support-triage
      mode: enforce
    endpoints:
      include:
        - support-api.openshell.svc.cluster.local
network_policies:
  service:
    name: support-api
    endpoints:
      - host: support-api.openshell.svc.cluster.local
        port: 18081
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /tickets
          - allow:
              method: GET
              path: /tickets/**
          - allow:
              method: GET
              path: /customers/**
          - allow:
              method: GET
              path: /kb
          - allow:
              method: GET
              path: /exports/customers
          - allow:
              method: DELETE
              path: /customers/**
    binaries:
      - path: /opt/agent/bin/python3.12
      - path: /usr/bin/python3.12
