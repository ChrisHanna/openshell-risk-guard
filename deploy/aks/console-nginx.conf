# TLS + HTTP basic auth in front of Risk Guard's read-only console (127.0.0.1:8791 in the same pod).
# Filled in by scripts/aks/09-expose-console.ps1: __ALLOW__ (one `allow` line per permitted address), __FQDN__ and
# __AUTH__ (HTTP basic auth, only with -RequirePassword).
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=console:1m rate=10r/s;

  # The certificate is read on each handshake, so a renewed certificate is served without a reload.
  map $server_name $console_cert { default /acme/live/tls.crt; }
  map $server_name $console_key { default /acme/live/tls.key; }

  # Port 80 is open to the internet so Let's Encrypt can validate the name. It serves only the challenge
  # files and redirects everything else to HTTPS.
  server {
    listen 8080;
    location /.well-known/acme-challenge/ {
      root /acme/webroot;
      default_type text/plain;
    }
    location / { return 301 https://__FQDN__$request_uri; }
  }

  server {
    listen 8443 ssl;
    ssl_certificate $console_cert;
    ssl_certificate_key $console_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;

    # Only the allowlisted addresses may use the console. The Service keeps the client address
    # (externalTrafficPolicy: Local), so this check sees the real source.
__ALLOW__
    deny all;

__AUTH__
    limit_req zone=console burst=40 nodelay;

    # The console is read-only; refuse anything that could change state.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / {
      proxy_pass http://127.0.0.1:8791;
      proxy_set_header Host 127.0.0.1:8791;
      proxy_http_version 1.1;
      proxy_read_timeout 30s;
    }
  }
}
