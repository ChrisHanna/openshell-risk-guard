# TLS + HTTP basic auth in front of Risk Guard's read-only console (127.0.0.1:8791 in the same pod).
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=console:1m rate=10r/s;

  server {
    listen 8443 ssl;
    ssl_certificate /etc/console-tls/tls.crt;
    ssl_certificate_key /etc/console-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;

    auth_basic "Risk Guard console";
    auth_basic_user_file /etc/console-auth/htpasswd;
    limit_req zone=console burst=40 nodelay;

    # The console is read-only; refuse anything that could change state.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / {
      proxy_pass http://127.0.0.1:8791;
      proxy_set_header Host 127.0.0.1:8791;
      proxy_http_version 1.1;
      proxy_read_timeout 30s;
    }
  }
}
