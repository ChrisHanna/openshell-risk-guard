# Risk Guard as an operator-run extension next to an OpenShell gateway installed from its Helm chart.
# Rendered by scripts/deploy-aks.ps1, which fills __IMAGE__ and creates the Secrets and ConfigMaps this
# file mounts (risk-guard-tls, risk-guard-hmac, risk-guard-baseline, risk-guard-api).
#
# One writer per SQLite file: replicas stay at 1 and the rollout is Recreate. The extension must be
# running before the gateway is configured to register it, because the gateway validates Describe at start.
apiVersion: v1
kind: Service
metadata:
  name: risk-guard
  namespace: openshell
spec:
  selector:
    app.kubernetes.io/name: risk-guard
  ports:
    - name: grpc-extension
      port: 50061
      targetPort: grpc-extension
__SVID_SERVICE_PORT__
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: risk-guard-data
  namespace: openshell
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-guard
  namespace: openshell
  labels:
    app.kubernetes.io/name: risk-guard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-guard
    spec:
      # With one replica and Recreate, the console is down from the moment the old pod is told to stop until the new one is
      # ready, so keep the old pod's shutdown short instead of waiting out the 30 second default.
      terminationGracePeriodSeconds: 8
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: baseline-import
          image: __IMAGE__
          args:
            - baseline-import
            - --db=/var/lib/openshell-risk-guard/risk-guard.db
            - --profile=/etc/openshell-risk-guard/baseline/baseline.json
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/openshell-risk-guard
            - name: baseline
              mountPath: /etc/openshell-risk-guard/baseline
              readOnly: true
        # One import per agent task profile (support, release, cloud). The image has no shell, so each is its own step.
        - name: baseline-import-support
          image: __IMAGE__
          args: [baseline-import, --db=/var/lib/openshell-risk-guard/risk-guard.db, --profile=/etc/openshell-risk-guard/baseline/support.json]
          securityContext: &baseline-security
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts: &baseline-mounts
            - name: data
              mountPath: /var/lib/openshell-risk-guard
            - name: baseline
              mountPath: /etc/openshell-risk-guard/baseline
              readOnly: true
        - name: baseline-import-release
          image: __IMAGE__
          args: [baseline-import, --db=/var/lib/openshell-risk-guard/risk-guard.db, --profile=/etc/openshell-risk-guard/baseline/release.json]
          securityContext: *baseline-security
          volumeMounts: *baseline-mounts
        - name: baseline-import-cloud
          image: __IMAGE__
          args: [baseline-import, --db=/var/lib/openshell-risk-guard/risk-guard.db, --profile=/etc/openshell-risk-guard/baseline/cloud.json]
          securityContext: *baseline-security
          volumeMounts: *baseline-mounts
      containers:
        - name: risk-guard
          image: __IMAGE__
          args:
            - serve
            - --listen=0.0.0.0:50061
            - --db=/var/lib/openshell-risk-guard/risk-guard.db
            - --gateway-id=openshell
            - --audience=urn:openshell:extension:risk-guard
            - --public-key-pem=/etc/openshell-ext-jwt/public.pem
            - --default-task-profile=demo-repo-review
            - --tls-cert=/etc/openshell-risk-guard/tls/tls.crt
            - --tls-key=/etc/openshell-risk-guard/tls/tls.key
            - --hmac-key-file=/etc/openshell-risk-guard/hmac/key
            - --api-semantics=/etc/openshell-risk-guard/api/api_semantics.yaml
            # Bind each sandbox to a workload derived from the workspace and the principal the
            # gateway authenticated. OpenShell's unauthenticated local-dev user is never accepted.
            - --workload-from-principal
__SVID_ARGS__
          ports:
            - name: grpc-extension
              containerPort: 50061
__SVID_CONTAINER_PORT__
          # Kubernetes' built-in gRPC probe cannot speak TLS and this listener is TLS-only, so the probe is the
          # binary itself: `health-check` calls grpc.health.v1 over TLS and succeeds only when the decision
          # store answers (NOT_SERVING means evaluations are already failing closed).
          readinessProbe:
            exec:
              command: ["/usr/local/bin/openshell-risk-guard", "health-check", "--endpoint=https://127.0.0.1:50061",
                        "--tls-ca=/etc/openshell-risk-guard/ca/ca.crt", "--server-name=risk-guard.openshell.svc"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/usr/local/bin/openshell-risk-guard", "health-check", "--endpoint=https://127.0.0.1:50061",
                        "--tls-ca=/etc/openshell-risk-guard/ca/ca.crt", "--server-name=risk-guard.openshell.svc"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/openshell-risk-guard
            - name: ext-jwt
              mountPath: /etc/openshell-ext-jwt
              readOnly: true
            - name: tls
              mountPath: /etc/openshell-risk-guard/tls
              readOnly: true
            - name: hmac
              mountPath: /etc/openshell-risk-guard/hmac
              readOnly: true
            - name: api
              mountPath: /etc/openshell-risk-guard/api
              readOnly: true
            - name: ca
              mountPath: /etc/openshell-risk-guard/ca
              readOnly: true
__SVID_MOUNT__
        # Operator console for the same database. It listens on the pod's loopback only; the nginx proxy added by
        # scripts/aks/09-expose-console.ps1 publishes it. With sign-in configured (scripts/aks/15-setup-console-signin.ps1)
        # it shows nothing to anyone but the listed Entra accounts. Locally: kubectl port-forward -n openshell deploy/risk-guard 8791
        - name: console
          image: __IMAGE__
          args:
            - dashboard
            - --listen=127.0.0.1:8791
            - --db=/var/lib/openshell-risk-guard/risk-guard.db
__CONSOLE_SIGNIN_ARGS__
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/openshell-risk-guard
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: risk-guard-data
        # Only the gateway's PUBLIC key: the signing key in the same Secret is never projected.
        - name: ext-jwt
          secret:
            secretName: openshell-jwt-keys
            items:
              - key: public.pem
                path: public.pem
        - name: tls
          secret:
            secretName: risk-guard-tls
            defaultMode: 0440
        - name: hmac
          secret:
            secretName: risk-guard-hmac
            defaultMode: 0440
        - name: baseline
          configMap:
            name: risk-guard-baseline
        - name: api
          configMap:
            name: risk-guard-api
        # Public CA certificate, used only by the health probe.
        - name: ca
          configMap:
            name: risk-guard-ca
__SVID_VOLUME__
