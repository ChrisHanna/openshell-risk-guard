# SPIRE for the Risk Guard demo cluster: installed by scripts/aks/17-deploy-spire.ps1 from the SPIFFE project's hardened Helm
# charts (https://github.com/spiffe/helm-charts-hardened). The trust domain is a name for this deployment, not a DNS name that
# has to resolve.
global:
  spire:
    clusterName: risk-guard-aks
    # The issuer in JWT-SVIDs, and the address of the OIDC discovery provider below that publishes the keys that sign them. A token
    # issuer (see deploy/aks/token-grant-demo.yaml) checks a sandbox's JWT-SVID against those keys.
    jwtIssuer: http://spire-spiffe-oidc-discovery-provider.openshell.svc.cluster.local
    trustDomain: __TRUST_DOMAIN__
    recommendations:
      enabled: false

spire-server:
  # SPIRE is installed into the openshell namespace, next to Risk Guard, so the trust bundle (the certificate authorities that
  # sign SVIDs) that SPIRE publishes as the ConfigMap `spire-bundle` can be mounted by Risk Guard and the egress proxy as the roots
  # they accept for client certificates. SPIRE keeps it current as its keys rotate. PEM, because that is what they read.
  bundlePublisher:
    k8sConfigMap:
      enabled: true
      format: pem
    externalK8sConfigMap:
      enabled: false

spire-agent:
  # The agents read the same ConfigMap, so they must expect the same format.
  trustBundleFormat: pem

# Publishes the keys that sign JWT-SVIDs, so a service can verify a sandbox's token. Served over plain HTTP inside the cluster: the keys
# are public, but a service that trusts them should be told that an in-cluster attacker who can alter this traffic could substitute
# their own. Use the chart's TLS options for anything beyond this demo.
spiffe-oidc-discovery-provider:
  enabled: true
  tls:
    spire:
      enabled: false
