# SPIRE for the Risk Guard demo cluster: installed by scripts/aks/17-deploy-spire.ps1 from the SPIFFE project's hardened Helm
# charts (https://github.com/spiffe/helm-charts-hardened). The trust domain is a name for this deployment, not a DNS name that
# has to resolve.
global:
  spire:
    clusterName: risk-guard-aks
    trustDomain: __TRUST_DOMAIN__
    recommendations:
      enabled: false

spire-server:
  # Publish the trust bundle (the certificate authorities that sign SVIDs) as PEM into the openshell namespace, where Risk Guard
  # mounts it as the roots it accepts for client certificates. SPIRE keeps the ConfigMap current as its keys rotate.
  bundlePublisher:
    k8sConfigMap:
      enabled: true
      namespace: openshell
      format: pem
    externalK8sConfigMap:
      enabled: false

# Not needed here: there is no OIDC federation, and the discovery provider needs an ingress and a certificate.
spiffe-oidc-discovery-provider:
  enabled: false
