# The agent fleet, run inside the cluster so it keeps going when no workstation is on. Applied by
# scripts/aks/16-deploy-fleet.ps1, which fills __IMAGE__, __ACR__ and __NAMESPACE__ and creates the ConfigMap
# agent-fleet-state (the agents' Entra application IDs) that is mounted below.
#
# It holds the cluster's own gateway client certificate (Secret openshell-client-tls, read-only) and nothing else: no
# Kubernetes API access, no registry credentials, no model key (the key lives in the gateway's provider and is injected
# on the way out).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-fleet
  namespace: openshell
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-fleet
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: agent-fleet
spec:
  replicas: 1
  # Two fleets would double the load and fight over the same sandboxes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-fleet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-fleet
    spec:
      serviceAccountName: agent-fleet
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fleet
          image: __IMAGE__
          env:
            - name: ACR_SERVER
              value: __ACR__
            - name: FLEET_STATE
              value: /etc/fleet/state/state.json
            # audit runs each agent's sandbox on the generated OpenShell policy (deploy/aks/agents/<profile>/policy.audit.yaml) in audit
            # mode: would-block events are logged, nothing is blocked. "enforce" would run policy.enforce.yaml, where OpenShell refuses
            # (docs/fleet-policy-modes.md has the gate and the steps; do not set it before the gate passes). Rollback: set this to "" and
            # re-apply, or redeploy the previous fleet image. Only sandboxes created afterwards are affected.
            - name: AGENT_POLICY_MODE
              value: "audit"
            # 1 also runs the SPIFFE token-grant agent (20-deploy-token-grant-demo.ps1; 16-deploy-fleet.ps1 -TokenAgent).
            - name: FLEET_TOKEN_AGENT
              value: "__TOKEN_AGENT__"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Each agent loop refreshes its own /tmp/fleet-heartbeat-<agent> at the start and end of every run and before every wait (a run
          # is stopped after RUN_TIMEOUT, 20 minutes, and a wait is at most 8), so a file goes stale only if that loop is stuck.
          livenessProbe:
            exec:
              command: ["sh", "-c", "set -- /tmp/fleet-heartbeat-*; [ -e \"$1\" ] || exit 1; for f; do [ $(( $(date +%s) - $(cat $f) )) -lt 1800 ] || exit 1; done"]
            initialDelaySeconds: 600
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: client-tls
              mountPath: /etc/fleet/client-tls
              readOnly: true
            - name: state
              mountPath: /etc/fleet/state
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: client-tls
          secret:
            secretName: openshell-client-tls
            defaultMode: 0440
        - name: state
          configMap:
            name: agent-fleet-state
        - name: tmp
          emptyDir: {}
