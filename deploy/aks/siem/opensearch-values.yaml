# DEMO ONLY. OpenSearch 3.9.0 (Apache-2.0), one node, on the tainted `siem` pool. Installed by scripts/aks/22-deploy-siem.ps1.
# The admin password is generated by the script into the Secret `opensearch-admin`; it is never in this file or in the repository.
clusterName: opensearch-cluster
nodeGroup: master
singleNode: true
replicas: 1
roles: [master, ingest, data]

opensearchJavaOpts: "-Xms2g -Xmx2g"
resources:
  requests: {cpu: "1", memory: 3Gi}
  limits: {memory: 4Gi}

# mmap off, so the node needs no vm.max_map_count sysctl and the chart's privileged init container is not needed.
config:
  opensearch.yml: |
    cluster.name: opensearch-cluster
    network.host: 0.0.0.0
    node.store.allow_mmap: false
sysctlInit:
  enabled: false

extraEnvs:
  - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef: {name: opensearch-admin, key: password}

persistence:
  enabled: true
  size: 20Gi

nodeSelector: {workload-class: siem}
tolerations:
  - {key: workload-class, operator: Equal, value: siem, effect: NoSchedule}

podSecurityContext: {fsGroup: 1000, runAsUser: 1000, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
securityContext: {capabilities: {drop: [ALL]}, runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false}
automountServiceAccountToken: false
service: {type: ClusterIP}
