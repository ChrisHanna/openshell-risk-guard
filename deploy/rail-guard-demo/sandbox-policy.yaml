# LOCAL INSECURE DEMO ONLY. Static policy deliberately permits BOTH calls.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /etc, /proc, /dev/urandom]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_middlewares:
  demo-risk:
    middleware: risk-guard
    order: 10
    on_error: fail_closed
    config:
      task_profile: demo-repo-review
      mode: enforce
    endpoints:
      include:
        - host.openshell.internal
network_policies:
  demo-fixture:
    name: fixture-read-and-delete
    endpoints:
      - host: host.openshell.internal
        port: 18081
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /repos/local/review/issues
          - allow:
              method: DELETE
              path: /repos/local/production
    binaries:
      - path: /usr/bin/curl
