# Provider profile for the NeMo Agent Toolkit demo agent, adapted from OpenShell's
# providers/nvidia.yaml and narrowed per OpenShell's security best practices:
# the key is sent only to integrate.api.nvidia.com, only for the two API paths the
# agent needs, and only for the agent's Python interpreter. The sandbox sees an opaque
# placeholder, never the real key.
id: nvidia-nat
display_name: NVIDIA (NeMo Agent Toolkit demo)
description: NVIDIA hosted inference for the demo agent
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: NVIDIA API key
    env_vars: [NVIDIA_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: integrate.api.nvidia.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: POST, path: /v1/chat/completions }
      - allow: { method: GET, path: /v1/models }
binaries:
  - /opt/agent/bin/python3.12
  - /usr/bin/python3.12
